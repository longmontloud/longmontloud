name: Longmont Music Scraper

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # This explicitly tells GitHub this job needs write access
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history so rebase works

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 ics pytz

      - name: Run Scraper
        run: python longmont_music.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add longmont_music_final.ics
          # This pulls latest changes before trying to push the new data
          git pull origin main --rebase
          git commit -m "Update calendar [automated]" || exit 0
          git push origin main
