name: Longmont Music Scraper

on:
  schedule:
    - cron: '0 11 * * *' # Runs at 5:00 AM Mountain Time (11:00 UTC)
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 ics pytz

      - name: Run Scraper
        run: python longmont_music.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add longmont_music_final.ics
          git commit -m "Update calendar [automated]" || exit 0
          git pull --rebase origin main
          git push
