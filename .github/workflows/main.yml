name: Longmont Music Scraper

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 ics pytz

      # We pull any manual changes YOU made before we run the scraper
      - name: Sync with Remote
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git pull origin main --rebase

      - name: Run Scraper
        run: python longmont_music.py

      - name: Commit and Push Changes
        run: |
          git add longmont_music_final.ics
          git commit -m "Update calendar [automated]" || exit 0
          git push origin main
